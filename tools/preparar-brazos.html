<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Preparar brazos</title>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/"
    }
  }
  </script>
  <style>body { font: 15px system-ui; padding: 24px; white-space: pre-wrap; }</style>
</head>
<body>
<div id="log">Cargando…</div>
<script type="module">
// Extrae del avatar solo la malla de brazos y manos (con su esqueleto) y la guarda
// como assets/models/brazos.glb. Se ejecuta una vez, con el servidor de desarrollo.
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const log = (...a) => {
  document.getElementById('log').textContent += `\n${a.join(' ')}`;
  console.log(...a);
};

const KEEP = /Clavicle|UpperArm|Forearm|Hand|Finger/i;

const fbx = await new FBXLoader().loadAsync('../assets/models/_fuente/Business_Male_01.fbx');
const meshes = [];
fbx.traverse((o) => {
  if (o.isSkinnedMesh) meshes.push(o);
});
log('mallas:', meshes.map((m) => `${m.name}(${m.geometry.attributes.position.count} vértices)`).join(', '));

const source = meshes.find((m) => /hipoly/i.test(m.name)) || meshes[0];
const skeleton = source.skeleton;
log('elegida:', source.name, '· huesos:', skeleton.bones.length);

// Índices de huesos de brazo y mano.
const armBones = new Set();
skeleton.bones.forEach((b, i) => {
  if (KEEP.test(b.name)) armBones.add(i);
});
log('huesos de brazo:', armBones.size);

const geo = source.geometry;
const pos = geo.attributes.position;
const skinIndex = geo.attributes.skinIndex;
const skinWeight = geo.attributes.skinWeight;
const index = geo.index;
const triCount = index ? index.count / 3 : pos.count / 3;

// Peso de cada vértice sobre huesos de brazo.
const armWeight = new Float32Array(pos.count);
for (let v = 0; v < pos.count; v++) {
  let w = 0;
  for (let k = 0; k < 4; k++) {
    const bone = skinIndex.getComponent(v, k);
    const weight = skinWeight.getComponent(v, k);
    if (armBones.has(bone)) w += weight;
  }
  armWeight[v] = w;
}

// Posiciones de los huesos de brazo (pose de enlace) para descartar restos sueltos.
source.updateWorldMatrix(true, true);
const toLocal = new THREE.Matrix4().copy(source.matrixWorld).invert();
const bonePos = [];
skeleton.bones.forEach((b, i) => {
  if (armBones.has(i)) bonePos.push(b.getWorldPosition(new THREE.Vector3()).applyMatrix4(toLocal));
});
geo.computeBoundingBox();
log('tamaño de la malla:', geo.boundingBox.getSize(new THREE.Vector3()).toArray().map((v) => v.toFixed(1)).join(' × '),
  '· primer hueso en', bonePos[0].toArray().map((v) => v.toFixed(1)).join(', '));
const centroid = new THREE.Vector3();
const vertex = new THREE.Vector3();
const nearArm = (a, b, c) => {
  centroid.set(0, 0, 0);
  for (const v of [a, b, c]) centroid.add(vertex.fromBufferAttribute(pos, v));
  centroid.divideScalar(3);
  let best = Infinity;
  for (const p of bonePos) best = Math.min(best, centroid.distanceTo(p));
  return best < 20; // centímetros
};

const keep = [];
for (let t = 0; t < triCount; t++) {
  const a = index ? index.getX(t * 3) : t * 3;
  const b = index ? index.getX(t * 3 + 1) : t * 3 + 1;
  const c = index ? index.getX(t * 3 + 2) : t * 3 + 2;
  if ((armWeight[a] + armWeight[b] + armWeight[c]) / 3 <= 0.6) continue;
  if (!nearArm(a, b, c)) continue;
  keep.push(a, b, c);
}
log('triángulos:', triCount, '→ conservados:', keep.length / 3);

// Geometría nueva con solo esos triángulos (reindexada).
const remap = new Map();
const order = [];
for (const v of keep) {
  if (!remap.has(v)) {
    remap.set(v, order.length);
    order.push(v);
  }
}
const out = new THREE.BufferGeometry();
for (const name of ['position', 'normal', 'uv', 'skinIndex', 'skinWeight']) {
  const src = geo.attributes[name];
  if (!src) continue;
  const dst = new src.array.constructor(order.length * src.itemSize);
  order.forEach((v, i) => {
    for (let k = 0; k < src.itemSize; k++) dst[i * src.itemSize + k] = src.array[v * src.itemSize + k];
  });
  out.setAttribute(name, new THREE.BufferAttribute(dst, src.itemSize, src.normalized));
}
out.setIndex(keep.map((v) => remap.get(v)));
out.computeBoundingSphere();

const mesh = new THREE.SkinnedMesh(out, new THREE.MeshStandardMaterial({ name: 'piel' }));
mesh.name = 'brazos';
const root = skeleton.bones[0];
let top = root;
while (top.parent && top.parent.isBone) top = top.parent;
const group = new THREE.Group();
group.add(top, mesh);
mesh.bind(skeleton, source.bindMatrix);

const glb = await new Promise((resolve, reject) => {
  new GLTFExporter().parse(group, resolve, reject, { binary: true, onlyVisible: false });
});
const bytes = new Uint8Array(glb);
let binary = '';
for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
const res = await fetch('/__save?path=assets/models/brazos.glb', { method: 'POST', body: btoa(binary) });
log('guardado en', await res.text(), `(${Math.round(bytes.length / 1024)} KB)`);

// Nombres de huesos útiles para el código de animación.
const bonesInfo = skeleton.bones.filter((b) => KEEP.test(b.name)).map((b) => b.name);
log('huesos exportados:', bonesInfo.join(', '));
</script>
</body>
</html>
